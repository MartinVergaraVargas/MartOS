# Configuracion de omen-fand2  (curvas de ventiladores del OMEN 16)
#
# La temperatura de referencia es max(CPU, GPU, SSD NVMe) leida del EC / hwmon.
# speed_curve va en % (0-100). Entre puntos se interpola linealmente.
# Por debajo del primer punto de temp_curve se aplica idle_speed.
#
# poll_interval: cada cuantos segundos se reevalua.
poll_interval = 2.0

# ---------------------------------------------------------------------------
# Con BATERIA -> prioridad SILENCIO
# Ventiladores apagados hasta 58 C; a partir de 60 C arrancan suave (~20%,
# ~1000 RPM, apenas audible) y suben poco a poco. 100% solo cerca de 96 C.
# ---------------------------------------------------------------------------
[battery]
temp_curve  = [50, 60, 75, 85, 92, 96]
speed_curve = [20, 30, 50, 55, 80, 100]
idle_speed  = 10

# ---------------------------------------------------------------------------
# Enchufado a CORRIENTE (AC) -> prioridad REFRIGERACION
# Suelo silencioso de 18% en reposo (~800 RPM, casi inaudible) y rampa firme
# para dar margen de turbo. 88% a 85 C, 100% a 92 C.
# ---------------------------------------------------------------------------
[ac]
temp_curve  = [50, 60, 70, 78, 85, 92]
speed_curve = [40, 50, 65, 80, 90, 100]
idle_speed  = 20
