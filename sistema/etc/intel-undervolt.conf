# /etc/intel-undervolt.conf  --  i7-11800H (OMEN 16-b0xxx)

enable yes

# --- CPU Undervolting ---
# index 0 = CPU core, 2 = CPU Cache : SIEMPRE el mismo valor en ambos.
# Empezamos conservador en -50 mV. Subir de -25 en -25 tras validar estabilidad.
undervolt 0 'CPU'            -50
undervolt 1 'GPU'            -10
undervolt 2 'CPU Cache'      -50
undervolt 3 'System Agent'   0
undervolt 4 'Analog I/O'     0

# --- Power limits (PL1/PL2) ---
# Comentado de momento. Si luego quieres fijar limites:
# power package 65 90

interval 5000

daemon undervolt:once
daemon power
daemon tjoffset
