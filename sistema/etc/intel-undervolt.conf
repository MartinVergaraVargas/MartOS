# ──────────────────────────────────────────────────────────────────
# MartOS
# Undervolt permanente del i7-11800H (programa intel-undervolt, compilado).
# CPU -50 mV · GPU integrada -10 mV · caché -50 mV (probado estable).
# Lo aplica intel-undervolt.service al arrancar y al volver de suspensión.
# Las líneas 'daemon' solo afectan a intel-undervolt-loop (deshabilitado).
# Tras editar: sudo intel-undervolt apply && sudo intel-undervolt read
# Guía de todos los archivos: ~/.config/MartOS/INFORME.md
# ──────────────────────────────────────────────────────────────────
# /etc/intel-undervolt.conf  --  i7-11800H (OMEN 16-b0xxx)

enable yes

# --- CPU Undervolting ---
# index 0 = CPU core, 2 = CPU Cache : SIEMPRE el mismo valor en ambos.
# Empezamos conservador en -50 mV. Subir de -25 en -25 tras validar estabilidad.
undervolt 0 'CPU'            -50
undervolt 1 'GPU'            -10
undervolt 2 'CPU Cache'      -50
undervolt 3 'System Agent'   0
undervolt 4 'Analog I/O'     0

# --- Power limits (PL1/PL2) ---
# Comentado de momento. Si luego quieres fijar limites:
# power package 65 90

interval 5000

daemon undervolt:once
daemon power
daemon tjoffset
