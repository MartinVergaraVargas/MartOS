# ──────────────────────────────────────────────────────────────────
# MartOS
# Opción del módulo ec_sys: write_support=1 permite ESCRIBIR en el
# Embedded Controller (/sys/kernel/debug/ec/ec0/io). Sin esto omen-fand2
# solo podría leer temperaturas, no mover los ventiladores.
# Tras editar: sudo update-initramfs -u y reiniciar.
# Guía de todos los archivos: ~/.config/MartOS/INFORME.md
# ──────────────────────────────────────────────────────────────────
# Necesario para que omen-fand2 pueda escribir en el Embedded Controller
options ec_sys write_support=1
