# ──────────────────────────────────────────────────────────────────
# MartOS
# nvidia-drm modeset=1: activa KMS del driver NVIDIA (necesario para
# Wayland y para que Plymouth se vea bien). También está en GRUB.
# Tras editar: sudo update-initramfs -u y reiniciar.
# Guía de todos los archivos: ~/.config/MartOS/INFORME.md
# ──────────────────────────────────────────────────────────────────
options nvidia-drm modeset=1
