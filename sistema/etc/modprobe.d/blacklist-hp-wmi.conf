# ──────────────────────────────────────────────────────────────────
# MartOS
# Impide que el kernel cargue hp_wmi automáticamente. En el OMEN 16 falla
# (Input/output error) y choca con omen_rgb_keyboard, que es una versión
# mejorada del mismo driver (recomendación de sus autores).
# Tras editar: sudo update-initramfs -u y reiniciar.
# Guía de todos los archivos: ~/.config/MartOS/INFORME.md
# ──────────────────────────────────────────────────────────────────
blacklist hp_wmi
