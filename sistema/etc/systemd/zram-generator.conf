# ──────────────────────────────────────────────────────────────────
# MartOS
# Swap comprimida en RAM (zram) de 6 GiB con zstd, prioridad 100
# (se usa antes que /swap.img). Ver también sysctl.d/99-zram-tmp.conf.
# Tras editar: reiniciar.
# Guía de todos los archivos: ~/.config/MartOS/INFORME.md
# ──────────────────────────────────────────────────────────────────
# Gestionado por optimizar-ram-tmp-swap.sh
[zram0]
zram-size = 6144
compression-algorithm = zstd
swap-priority = 100
