# ──────────────────────────────────────────────────────────────────
# MartOS
# Límites de potencia de la RTX 3060 (W) que aplica nvidia-power-limit.sh.
# AC_LIMIT = enchufado · BATT_LIMIT = batería (se sube al mínimo de la GPU).
# Tras editar: sudo systemctl start nvidia-power-limit
# Guía de todos los archivos: ~/.config/MartOS/INFORME.md
# ──────────────────────────────────────────────────────────────────
# Limite de potencia de la GPU NVIDIA en vatios.
# Aplica tras editar con:  sudo systemctl start nvidia-power-limit.service
AC_LIMIT=100
BATT_LIMIT=40
