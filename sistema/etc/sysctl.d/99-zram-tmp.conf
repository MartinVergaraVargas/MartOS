# ──────────────────────────────────────────────────────────────────
# MartOS
# Ajustes del kernel para swap en zram: swappiness=100 (usar zram sin
# miedo, es RAM comprimida) y page-cluster=0 (sin lectura anticipada).
# Tras editar: sudo sysctl --system
# Guía de todos los archivos: ~/.config/MartOS/INFORME.md
# ──────────────────────────────────────────────────────────────────
# Gestionado por optimizar-ram-tmp-swap.sh
vm.swappiness = 100
vm.page-cluster = 0
