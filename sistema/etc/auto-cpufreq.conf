# ──────────────────────────────────────────────────────────────────
# MartOS
# Perfiles de CPU de auto-cpufreq. [charger] = rendimiento con turbo;
# [battery] = ahorro máximo: 1,1 GHz tope y sin turbo.
# power-profiles-daemon está enmascarado para no chocar con este.
# Tras editar: sudo systemctl restart auto-cpufreq
# Guía de todos los archivos: ~/.config/MartOS/INFORME.md
# ──────────────────────────────────────────────────────────────────
[charger]
governor = performance
energy_performance_preference = balance_performance
#scaling_max_freq = 4600000
turbo = auto

[battery]
governor = powersave
energy_performance_preference = balance_power
scaling_max_freq = 1100000
turbo = never
